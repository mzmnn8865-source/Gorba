<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>گربه‌رقصان</title>
<link href="https://fonts.googleapis.com/css2?family=Lalezar&family=Harmattan:wght@400;700&display=swap" rel="stylesheet">
<style>
/* ============================================================
   متغیرهای رنگ و سیستم طراحی «کافهٔ چوبی/کاغذی»
   ============================================================ */
:root{
  color-scheme:dark;
  --bg:#1d1612; --paper:#f1e4cc; --ink:#2b1d14;
  --hot:#ff6b3d; --mint:#7fd6b0; --wood:#3a2a1f;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px)
}
*{box-sizing:border-box}
html,body{
  margin:0;background:var(--bg);color:var(--paper);
  font-family:'Harmattan','Tahoma',sans-serif;font-size:19px
}
body{
  background:radial-gradient(120% 60% at 50% 0,#3b2417 0,var(--bg) 70%) fixed;
  min-height:100%
}
/* نویز کاغذی روی کل صفحه */
body::after{
  content:"";position:fixed;inset:0;pointer-events:none;opacity:.07;
  mix-blend-mode:overlay;
  background:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='n'><feTurbulence baseFrequency='.9' numOctaves='2'/></filter><rect width='160' height='160' filter='url(%23n)'/></svg>")
}
main{max-width:760px;margin:0 auto;padding:14px 14px 40px}
h1{
  font:400 clamp(34px,9vw,56px)/1 'Lalezar','Tahoma',sans-serif;
  margin:6px 4px 2px;color:var(--paper);
  transform:rotate(-1.2deg);text-shadow:3px 3px 0 var(--hot)
}
.sub{margin:0 6px 12px;opacity:.7}

/* ============================================================
   صحنه
   ============================================================ */
.stage{
  position:relative;height:clamp(320px,52vh,500px);
  border-radius:22px 30px 20px 28px;overflow:hidden;
  border:3px solid #000;
  box-shadow:0 0 0 3px var(--wood),0 14px 30px #0009;
  transition:transform .05s linear
}
.stage canvas{width:100%;height:100%;display:block}
.badge{
  position:absolute;top:10px;left:10px;background:var(--paper);color:var(--ink);
  padding:2px 12px 4px;border-radius:12px 4px 12px 4px;font-weight:700;
  transform:rotate(-2deg);box-shadow:2px 2px 0 #0007
}

/* ============================================================
   میز پلیر
   ============================================================ */
.deck{
  position:relative;margin-top:22px;padding:18px 16px 16px;
  background:linear-gradient(160deg,#4a3526,#2f2118);
  border-radius:26px 18px 28px 20px;
  box-shadow:inset 0 2px 0 #fff2,0 12px 28px #000a;
  border:2px solid #0008
}
.deck::before,.deck::after{
  content:"";position:absolute;width:74px;height:22px;
  background:#e8d9a8cc;top:-11px;transform:rotate(-5deg);right:22px;
  box-shadow:0 1px 3px #0005
}
.deck::after{left:26px;right:auto;transform:rotate(4deg)}
.tape{
  background:var(--paper);color:var(--ink);
  border-radius:14px 10px 16px 10px;padding:10px 12px 12px;
  transform:rotate(.4deg);box-shadow:0 3px 0 #0006
}
.label{border-bottom:2px dashed #2b1d1455;padding-bottom:4px;margin-bottom:8px}
#title{
  font:400 26px/1.2 'Lalezar',sans-serif;display:block;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis
}
#sub{opacity:.65;font-size:17px}

/* رکوردهای چرخان */
.win{
  background:#1a120d;border-radius:40px;height:74px;
  display:flex;justify-content:space-around;align-items:center;padding:0 22px;
  box-shadow:inset 0 3px 8px #000
}
.win svg{width:60px;height:60px}

#vu{width:100%;height:46px;display:block;margin:12px 0 4px}

/* ============================================================
   تایم‌لاین کاغذی (بدون رقص نور - هم‌خانوادهٔ سایت)
   ============================================================ */
.timeline{
  position:relative;height:34px;margin:10px 2px 6px;
  background:linear-gradient(180deg,#2a1c12,#1a1109);
  border-radius:8px;padding:6px 8px;
  box-shadow:inset 0 2px 4px #000;
  display:flex;align-items:center;gap:8px;
  font-size:14px;direction:ltr
}
.timeline .t{
  font-family:'Lalezar',sans-serif;font-size:15px;color:var(--paper);
  opacity:.75;min-width:38px;text-align:center;
  letter-spacing:.5px
}
.timeline .track{
  position:relative;flex:1;height:8px;
  background:#f1e4cc11;border-radius:2px;cursor:pointer;
  border-top:1px solid #0008;
  box-shadow:inset 0 1px 2px #000
}
/* پراگرس به شکل کاغذ جوهرخورده */
.timeline .fill{
  position:absolute;top:0;bottom:0;right:0;width:0;
  background:
    repeating-linear-gradient(90deg,#f1e4cc 0 2px,transparent 2px 5px),
    var(--paper);
  border-radius:2px;
  box-shadow:0 0 0 1px #0007 inset
}
/* دستگیره به شکل سوزن گرامافون کوچک */
.timeline .pin{
  position:absolute;top:50%;right:0;width:12px;height:12px;
  background:var(--paper);border:2px solid #000;
  border-radius:50%;transform:translate(50%,-50%);
  box-shadow:0 1px 0 #000
}
.timeline .track::before{
  content:"";position:absolute;inset:2px 0;
  background:repeating-linear-gradient(90deg,transparent 0 15px,#f1e4cc18 15px 16px)
}

/* ============================================================
   کنترل‌ها
   ============================================================ */
.btns{
  display:flex;align-items:center;justify-content:center;gap:14px;
  margin:12px 0;direction:ltr
}
.btn{
  width:54px;height:54px;border-radius:16px 12px 16px 12px;
  border:2px solid #000;background:#d9c7a4;color:var(--ink);
  display:grid;place-items:center;box-shadow:0 5px 0 #000;
  cursor:pointer;padding:0;transition:transform .06s,box-shadow .06s
}
.btn:active{transform:translateY(4px);box-shadow:0 1px 0 #000}
.btn.big{width:72px;height:66px;background:var(--hot);color:#fff}
.btn svg{width:26px;height:26px;fill:currentColor}
.vol{
  -webkit-appearance:none;appearance:none;width:90px;flex:none;
  height:8px;border-radius:6px;background:#0007;outline:0;direction:ltr
}
.vol::-webkit-slider-thumb{
  -webkit-appearance:none;width:20px;height:20px;border-radius:50%;
  background:var(--hot);border:3px solid var(--paper);box-shadow:0 2px 0 #000
}
.vol::-moz-range-thumb{
  width:14px;height:14px;border-radius:50%;background:var(--hot);
  border:3px solid var(--paper)
}

/* ============================================================
   سنجه‌ها (بدون نمایش درصد راک)
   ============================================================ */
.meters{
  display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:8px 0 14px
}
.m{
  background:#0005;border-radius:12px 8px 12px 8px;padding:6px 8px;
  text-align:center;border:1px solid #fff1
}
.m b{
  display:block;font:400 22px 'Lalezar',sans-serif;color:var(--mint);
  white-space:nowrap
}
.m span{font-size:15px;opacity:.65}
.m i{
  display:block;height:5px;border-radius:3px;background:#fff2;
  margin-top:4px;overflow:hidden
}
.m i u{display:block;height:100%;width:0;background:var(--hot)}

/* ============================================================
   انتخاب سبک / drop
   ============================================================ */
.stylebar{
  display:flex;align-items:center;justify-content:space-between;
  background:#0004;border-radius:12px 8px 12px 8px;padding:8px 12px;
  margin-bottom:10px;border:1px solid #fff1
}
.stylebar .cur{
  font-family:'Lalezar',sans-serif;color:var(--paper);font-size:20px;
  display:flex;align-items:center;gap:8px
}
.stylebar .cur::before{
  content:"";width:10px;height:10px;border-radius:50%;
  background:var(--hot);box-shadow:0 0 0 2px #000
}
.stylebar button{
  background:var(--paper);color:var(--ink);
  border:2px solid #000;border-radius:8px 6px 8px 6px;
  font-family:'Lalezar',sans-serif;font-size:17px;padding:4px 14px 6px;
  cursor:pointer;box-shadow:0 3px 0 #000
}
.stylebar button:active{transform:translateY(2px);box-shadow:0 1px 0 #000}

.drop{
  display:block;text-align:center;padding:14px;
  border:2px dashed #f1e4cc77;border-radius:16px;cursor:pointer;
  transform:rotate(-.5deg)
}
.drop.on,.drop:hover{background:#ff6b3d22;border-color:var(--hot)}
.drop input{display:none}

#list{
  list-style:none;margin:12px 0 0;padding:0;display:grid;gap:6px
}
#list li{
  padding:7px 12px;border-radius:10px;background:#0004;cursor:pointer;
  display:flex;justify-content:space-between;gap:8px
}
#list li.cur{background:var(--paper);color:var(--ink);font-weight:700}
#list li span:first-child{
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap
}

/* ============================================================
   مودال انتخاب سبک
   ============================================================ */
.modal{
  position:fixed;inset:0;background:rgba(15,9,6,.85);
  display:none;align-items:center;justify-content:center;
  padding:20px;z-index:50;backdrop-filter:blur(4px)
}
.modal.on{display:flex}
.modal-box{
  background:linear-gradient(160deg,#4a3526,#2f2118);
  border:3px solid #000;box-shadow:0 0 0 3px var(--wood),0 20px 60px #000;
  border-radius:26px 18px 28px 20px;
  padding:22px 20px 20px;max-width:640px;width:100%;
  max-height:90vh;overflow:auto;position:relative
}
.modal-box h2{
  font:400 30px 'Lalezar',sans-serif;margin:0 0 4px;color:var(--paper);
  transform:rotate(-1deg);text-shadow:2px 2px 0 var(--hot)
}
.modal-box p{margin:0 0 18px;opacity:.75;font-size:16px}
.style-grid{
  display:grid;grid-template-columns:repeat(2,1fr);gap:12px
}
@media (min-width:520px){.style-grid{grid-template-columns:repeat(3,1fr)}}
.style-card{
  background:var(--paper);color:var(--ink);
  border:2px solid #000;border-radius:14px 10px 16px 10px;
  padding:12px 10px 14px;cursor:pointer;
  text-align:center;box-shadow:0 4px 0 #000;
  transition:transform .08s,box-shadow .08s;
  position:relative
}
.style-card:hover{transform:translateY(-2px);box-shadow:0 6px 0 #000}
.style-card:active{transform:translateY(3px);box-shadow:0 1px 0 #000}
.style-card svg{width:56px;height:56px;display:block;margin:0 auto 4px}
.style-card b{font:400 22px 'Lalezar',sans-serif;display:block}
.style-card span{font-size:14px;opacity:.65}
.style-card .swatch{
  position:absolute;top:6px;left:6px;width:14px;height:14px;
  border-radius:4px;border:2px solid #000
}
</style>
</head>
<body>
<main>
  <h1>گربه‌رقصان</h1>
  <p class="sub">آهنگت رو بنداز تو؛ پنج تا گربه به سلیقهٔ خودشون می‌رقصن و می‌نوازن.</p>

  <section class="stage" id="stage">
    <canvas id="cv"></canvas>
    <div class="badge" id="badge">منتظر موزیک…</div>
  </section>

  <section class="deck">
    <div class="tape">
      <div class="label">
        <span id="title">هنوز آهنگی نیست</span>
        <span id="sub">یه فایل صوتی انتخاب کن</span>
      </div>
      <div class="win">
        <svg viewBox="-30 -30 60 60"><g id="r1">
          <circle r="26" fill="#3a2a1f"/><circle r="9" fill="#f1e4cc"/>
          <path d="M0-9V-24M8-5L21-12M8 5L21 12M0 9V24M-8 5L-21 12M-8-5L-21-12"
                stroke="#f1e4cc" stroke-width="3" stroke-linecap="round"/>
        </g></svg>
        <svg viewBox="-30 -30 60 60"><g id="r2">
          <circle r="26" fill="#3a2a1f"/><circle r="9" fill="#f1e4cc"/>
          <path d="M0-9V-24M8-5L21-12M8 5L21 12M0 9V24M-8 5L-21 12M-8-5L-21-12"
                stroke="#f1e4cc" stroke-width="3" stroke-linecap="round"/>
        </g></svg>
      </div>
    </div>

    <canvas id="vu"></canvas>

    <!-- تایم‌لاین کاغذی هم‌خانوادهٔ سایت (بدون رقص نور) -->
    <div class="timeline" id="tl">
      <span class="t" id="tc">0:00</span>
      <div class="track" id="track">
        <div class="fill" id="fill"></div>
        <div class="pin" id="pin"></div>
      </div>
      <span class="t" id="td">0:00</span>
    </div>

    <div class="btns">
      <button class="btn" id="prev" aria-label="قبلی">
        <svg viewBox="0 0 24 24"><path d="M6 5h2v14H6zM20 5v14L9 12z"/></svg>
      </button>
      <button class="btn big" id="play" aria-label="پخش">
        <svg viewBox="0 0 24 24" id="ic"><path d="M7 4v16l13-8z"/></svg>
      </button>
      <button class="btn" id="next" aria-label="بعدی">
        <svg viewBox="0 0 24 24"><path d="M16 5h2v14h-2zM4 5l11 7L4 19z"/></svg>
      </button>
      <input class="vol" type="range" id="vol" min="0" max="100" value="85" aria-label="صدا">
    </div>

    <!-- سنجه‌ها: بدون نمایش «راک‌بودن» برای کاربر -->
    <div class="meters">
      <div class="m"><span>تمپو</span><b id="mb">—</b></div>
      <div class="m"><span>حال‌وهوا</span><b id="mm">—</b></div>
      <div class="m"><span>انرژی</span><b id="me">۰</b><i><u id="ue"></u></i></div>
    </div>

    <div class="stylebar">
      <div class="cur" id="styleName">سبک: راک</div>
      <button id="styleBtn">تغییر سبک</button>
    </div>

    <label class="drop" id="drop">
      <input type="file" id="file" accept="audio/*" multiple>
      🎵 آهنگ‌هات رو اینجا بنداز یا بزن تا انتخاب کنی
    </label>
    <ul id="list"></ul>
  </section>
</main>

<!-- ============================================================
     مودال انتخاب سبک
     ============================================================ -->
<div class="modal" id="modal">
  <div class="modal-box">
    <h2>سبک آهنگت چیه؟</h2>
    <p>بر اساس انتخاب تو، لباس و ساز گربه‌ها عوض می‌شه.</p>
    <div class="style-grid" id="styleGrid"></div>
  </div>
</div>

<audio id="au" preload="auto"></audio>

<script>
/* ============================================================
   ۰. ابزارهای عمومی
   ============================================================ */
const $  = s => document.querySelector(s);
const fa = n => Math.round(n).toLocaleString('fa-IR');
const clamp = (v, a = 0, b = 1) => Math.min(b, Math.max(a, v));
const wrap  = a => Math.atan2(Math.sin(a), Math.cos(a));
const lerp  = (a, b, t) => a + (b - a) * t;
const rand  = (a, b) => a + Math.random() * (b - a);

/* ============================================================
   ۱. موتور تحلیل صدا (دو مسیر: آنی + نرم)
   ------------------------------------------------------------
   - مسیر «آنی» برای onset، گیت سکوت، پالس
   - مسیر «نرم» برای رنگ، حال‌وهوا، تمپو
   - تشخیص «وکال» با باند ۳۰۰-۳۴۰۰ + قله‌های هارمونیک
   - گیت سکوت پویا نسبت به میانگین ۳ ثانیه‌ی اخیر
   ============================================================ */
class AudioEngine {
  constructor(el) {
    this.el = el;
    this.ctx = null;
    this.analyser = null;
    this.freq = null;
    this.time = null;
    this.prevFreq = null;

    // آنی
    this.rms = 0;
    this.bass = 0;
    this.mid = 0;
    this.high = 0;
    this.vocal = 0;       // احتمال وکال بودن
    this.vocalRaw = 0;    // باند وکال خام
    this.flux = 0;
    this.silence = 1;     // ۱ = سکوت کامل

    // نرم
    this.sBass = 0;
    this.sMid = 0;
    this.sHigh = 0;
    this.sEnergy = 0;
    this.sVocal = 0;

    // ضرب
    this.bpm = 100;
    this.hasBpm = false;
    this.beat = 0;
    this.pulse = 0;
    this.onsets = [];
    this.lastOnset = -10;
    this.history = [];
    this.connected = false;
  }

  connect() {
    if (this.connected) return;
    this.ctx = new (window.AudioContext || window.webkitAudioContext)();
    this.analyser = this.ctx.createAnalyser();
    this.analyser.fftSize = 2048;
    // smoothing پایین برای پاسخ سریع
    this.analyser.smoothingTimeConstant = 0.15;
    const src = this.ctx.createMediaElementSource(this.el);
    src.connect(this.analyser);
    this.analyser.connect(this.ctx.destination);
    this.freq = new Uint8Array(this.analyser.frequencyBinCount);
    this.time = new Float32Array(this.analyser.fftSize);
    this.prevFreq = new Float32Array(this.freq.length);
    this.connected = true;
  }

  async resume() {
    if (this.ctx && this.ctx.state === 'suspended') await this.ctx.resume();
  }

  bandAvg(from, to) {
    let s = 0;
    for (let i = from; i < to; i++) s += this.freq[i];
    return s / ((to - from) * 255);
  }

  /* تحلیل هر فریم */
  update(dt, t, playing) {
    /* اگر متصل نیست یا در حال پخش نیست → خاموشی سریع */
    if (!this.connected || !playing) {
      this.rms    *= 0.6;
      this.bass   *= 0.6;
      this.mid    *= 0.6;
      this.high   *= 0.6;
      this.vocal  *= 0.6;
      this.flux   *= 0.6;
      this.sBass  *= 0.85;
      this.sMid   *= 0.85;
      this.sHigh  *= 0.85;
      this.sEnergy*= 0.88;
      this.sVocal *= 0.85;
      this.pulse  *= 0.82;
      // سکوت با نرخ سریع بالا می‌ره
      this.silence = Math.min(1, this.silence + dt * 6);
      return;
    }

    this.analyser.getByteFrequencyData(this.freq);
    this.analyser.getFloatTimeDomainData(this.time);

    /* --- RMS --- */
    let sum = 0;
    for (let i = 0; i < this.time.length; i++) sum += this.time[i] * this.time[i];
    const rms = Math.sqrt(sum / this.time.length);

    /* --- باندها --- */
    const bass = this.bandAvg(1, 8);
    const mid  = this.bandAvg(8, 90);
    const high = this.bandAvg(90, 400);

    /* --- باند وکال: ۳۰۰ تا ۳۴۰۰ هرتز --- */
    const binHz = this.ctx.sampleRate / this.analyser.fftSize;
    const vFrom = Math.max(1, Math.floor(300 / binHz));
    const vTo   = Math.min(this.freq.length - 1, Math.floor(3400 / binHz));
    let vSum = 0, vCount = 0;
    for (let i = vFrom; i < vTo; i++) { vSum += this.freq[i]; vCount++; }
    const vocalRaw = vCount ? vSum / (vCount * 255) : 0;

    /* --- flux --- */
    let flux = 0;
    for (let i = 1; i < 250; i++) {
      const d = this.freq[i] / 255 - this.prevFreq[i];
      if (d > 0) flux += d;
    }
    flux /= 250;
    for (let i = 0; i < this.freq.length; i++)
      this.prevFreq[i] = this.freq[i] / 255;

    /* --- گیت سکوت پویا --- */
    this.history.push(rms);
    if (this.history.length > 90) this.history.shift();
    const avgHist = this.history.reduce((a, b) => a + b, 0) / this.history.length;

    // اگر RMS به‌شدت زیر میانگین یا در حد نویز پس‌زمینه است → سکوت
    const silent =
      rms < 0.012 ||
      (avgHist > 0.02 && rms < avgHist * 0.32 && flux < 0.006);

    /* --- تشخیص وکال ---
       - vocalRaw بالا + mid معنی‌دار + نه سکوت
       - فیلترگذاری روی bass شدید (کیک و بیس) تا وکال‌نمایی نکند */
    const bassGate = clamp((mid * 0.9 + 0.02 - bass * 0.7) / 0.25);
    const vocalPresence = clamp((vocalRaw - 0.04) / 0.22) * bassGate;

    /* --- ذخیرهٔ آنی --- */
    this.rms    = rms;
    this.bass   = bass;
    this.mid    = mid;
    this.high   = high;
    this.vocalRaw = vocalRaw;
    this.vocal  = vocalPresence * (silent ? 0 : 1);
    this.flux   = flux;
    this.silence = silent
      ? Math.min(1, this.silence + dt * 9)   // ورود سریع به سکوت
      : Math.max(0, this.silence - dt * 14); // خروج سریع از سکوت

    /* --- نرم‌سازی با نرخ‌های مختلف برای attack/release --- */
    const attack  = 1 - Math.exp(-dt / 0.04);
    const release = 1 - Math.exp(-dt / 0.22);
    const sm = (cur, target) =>
      cur + (target - cur) * (target > cur ? attack : release);

    this.sBass  = sm(this.sBass,  bass);
    this.sMid   = sm(this.sMid,   mid);
    this.sHigh  = sm(this.sHigh,  high);
    this.sVocal = sm(this.sVocal, this.vocal);

    const energy = clamp((bass * 0.4 + mid * 0.4 + high * 0.2 - 0.12) / 0.5);
    this.sEnergy = sm(this.sEnergy, energy * (1 - this.silence));

    /* --- onset و پالس --- */
    this.pulse *= Math.exp(-dt * 11);
    if (!silent && flux > 0.010 && t - this.lastOnset > 0.20) {
      if (bass > 0.30) {
        const err = Math.round(this.beat) - this.beat;
        this.beat += err * 0.35;
      }
      this.lastOnset = t;
      this.onsets.push(t);
      if (this.onsets.length > 64) this.onsets.shift();
      this.pulse = clamp(0.4 + flux * 8);
      this.estimateBpm();
    }
    this.beat += dt * this.bpm / 60;
  }

  /* تخمین BPM از فاصله‌ی onsetها */
  estimateBpm() {
    const on = this.onsets;
    if (on.length < 8) return;
    const hist = new Float32Array(60);
    for (let i = 1; i < on.length; i++) {
      for (let j = 1; j <= 3 && i - j >= 0; j++) {
        const d = on[i] - on[i - j];
        if (d < 0.18 || d > 2.5) continue;
        let b = 60 / d;
        while (b < 70) b *= 2;
        while (b > 180) b /= 2;
        const idx = Math.round((b - 70) / 2);
        if (idx >= 0 && idx < 60) {
          hist[idx] += 1 / j;
          if (idx > 0)  hist[idx - 1] += 0.4 / j;
          if (idx < 59) hist[idx + 1] += 0.4 / j;
        }
      }
    }
    let bi = 0;
    for (let i = 1; i < 60; i++) if (hist[i] > hist[bi]) bi = i;
    if (hist[bi] < 1.5) return;
    const newBpm = 70 + bi * 2;
    this.bpm += (newBpm - this.bpm) * 0.22;
    this.hasBpm = true;
  }

  reset() {
    this.onsets.length = 0;
    this.history.length = 0;
    this.hasBpm = false;
    this.bpm = 100;
    this.beat = 0;
    this.silence = 1;
    this.pulse = 0;
    this.vocal = 0;
    this.sVocal = 0;
  }
}

   ۳. ذرات افکت (جرقه، کانفتی، نُت، دود، نئون، طلا)
   ============================================================ */
class Particles {
  constructor() {
    this.items = [];
  }
  spawn(type, x, y, hue) {
    const conf = {
      sparks:   { n: 6, life: [.3,.6], vx: 3,   vy: -4, g: 12, size: [1,2],  color: () => `hsl(${20 + Math.random()*30} 95% 60%)` },
      confetti: { n: 8, life: [.8,1.4], vx: 4,  vy: -5, g: 10, size: [2,4],  color: () => `hsl(${Math.random()*360} 80% 65%)` },
      notes:    { n: 4, life: [.9,1.5], vx: 2,  vy: -3, g: 2,  size: [8,12], color: () => `hsl(${hue||40} 70% 75%)`, glyph: true },
      smoke:    { n: 4, life: [1.2,2], vx: 2,   vy: -1.5, g: 0, size: [4,8],color: () => `hsla(30 40% 70% / .5)` },
      neon:     { n: 6, life: [.5,.9], vx: 5,   vy: -2, g: 6,  size: [1.5,3],color: () => `hsl(${190 + Math.random()*40} 95% 65%)` },
      gold:     { n: 5, life: [.6,1],  vx: 3,   vy: -3, g: 8,  size: [2,3],  color: () => `hsl(45 95% 60%)` },
    }[type] || null;
    if (!conf) return;
    for (let i = 0; i < conf.n; i++) {
      this.items.push({
        x, y,
        vx: rand(-conf.vx, conf.vx),
        vy: rand(conf.vy*0.5, conf.vy*1.2),
        g: conf.g,
        life: rand(conf.life[0], conf.life[1]),
        maxLife: conf.life[1],
        size: rand(conf.size[0], conf.size[1]),
        color: conf.color(),
        glyph: !!conf.glyph,
      });
    }
    if (this.items.length > 400) this.items.splice(0, this.items.length - 400);
  }
  update(dt) {
    for (let i = this.items.length - 1; i >= 0; i--) {
      const p = this.items[i];
      p.life -= dt;
      if (p.life <= 0) { this.items.splice(i, 1); continue; }
      p.vy += p.g * dt;
      p.x += p.vx * dt;
      p.y += p.vy * dt;
    }
  }
  draw(g) {
    for (const p of this.items) {
      const a = clamp(p.life / p.maxLife);
      if (p.glyph) {
        g.fillStyle = p.color;
        g.globalAlpha = a;
        g.font = `${p.size * 2}px serif`;
        g.fillText('♪', p.x, p.y);
        g.globalAlpha = 1;
      } else {
        g.fillStyle = p.color;
        g.globalAlpha = a;
        g.beginPath();
        g.arc(p.x, p.y, p.size, 0, 7);
        g.fill();
        g.globalAlpha = 1;
      }
    }
  }
}

class Cat {
  constructor(def, index) {
    this.def = def;
    this.cfg = def.cfg;
    this.colors = def.colors;
    this.role = def.role;
    this.index = index;

    // مکان و مقیاس (هر فریم ست می‌شود)
    this.x = 0; this.y = 0; this.scale = 1;

    // فاز حرکتی
    this.phase = 0;
    this.speed = 1;
    this.mult = 1;              // ضریب تمپو (خواننده ۲x، درامر ۰.۵x و...)
    this.offset = 0;            // اختلاف فاز

    // آنی‌ها
    this.energy = 0.15;
    this.jump = 0;
    this.jumpV = 0;
    this.lean = 0;
    this.headTilt = 0;
    this.headNod = 0;
    this.squash = 1;
    this.frozen = 0;

    // دست‌ها و پاها
    this.armL = -0.6;  // شانه چپ
    this.armR = 0.6;   // شانه راست
    this.elbowL = 0.5;
    this.elbowR = -0.5;
    this.footL = 0;
    this.footR = 0;

    // دنباله
    this.tailSegs = [0.2, 0.3, 0.4];

    // حالت صورت
    this.mouthOpen = 0;
    this.eyeShut = 0;
    this.earL = 0;
    this.earR = 0;
    this.blinkT = rand(0, 4);

    // نقشه‌ی زمانی
    this.roleTime = 0;
    this.strumDir = 1;
    this.strumCycle = 0;
    this.hitL = 0;
    this.hitR = 0;
    this.keyIdx = 0;
  }

  /* ------- به‌روزرسانی حالت گربه بر اساس صدا و سبک ------- */
  update(dt, t, A, style, playing) {
    const slumped = A.silence > 0.55;
    const asleep = !playing || A.silence > 0.75;

    /* فاز مستقل گربه */
    const bpmFactor = A.hasBpm ? (A.bpm / 60) : 1.6;
    const sp = (playing && !asleep) ? 1 : 0.3;
    this.phase += dt * Math.PI * 2 * bpmFactor * this.mult * sp * 0.5;

    /* قفل ضرب: هر چند وقت یک‌بار فاز به ضرب نزدیک می‌شود */
    if (playing && !asleep && A.pulse > 0.6) {
      const lock = A.beat * Math.PI * this.mult;
      const k = 0.08 * this.speed;
      this.phase = lerp(this.phase, lock + this.offset, k);
    }

    /* انرژی هدف */
    let targetEnergy = asleep
      ? 0.03
      : clamp(0.25 + A.sEnergy * 1.05) * (1 - A.silence * 0.5);
    if (this.frozen > 0) { targetEnergy *= 0.2; this.frozen -= dt; }
    else if (Math.random() < dt * 0.15 * (1 - A.sEnergy))
      this.frozen = rand(0.15, 0.5);

    const atk = targetEnergy > this.energy ? 8 : 3;
    this.energy += (targetEnergy - this.energy) * clamp(dt * atk);

    /* پرش: روی onsetهای قوی */
    if (playing && !asleep && A.pulse > 0.55 && A.bass > 0.35 && this.jump <= 0.01) {
      if (Math.random() < 0.25 + A.pulse * 0.6) {
        this.jumpV = -(0.25 + this.energy * 0.4 + A.pulse * 0.3) * (0.5 + this.speed * 0.7);
      }
    }
    // فیزیک پرش (فقط برای گربه‌های غیردرامر)
    if (this.role !== 'drums') {
      this.jumpV += 4.2 * dt;              // گرانش
      this.jump  += this.jumpV * dt;
      if (this.jump >= 0) { this.jump = 0; this.jumpV = 0; }
    } else {
      this.jump = Math.max(0, this.jump - dt * 3);
    }

    /* اسکواش/کشش */
    const targetSq = this.jump < -0.02 ? 1.1 : (A.pulse > 0.6 ? 0.92 : 1);
    this.squash += (targetSq - this.squash) * clamp(dt * 12);

    /* تکیه و کج شدن */
    const leanTarget = asleep
      ? 0.25
      : (this.role === 'drums' ? 0.08
       : this.role === 'keys'  ? 0.15
       : 0.0) + Math.sin(this.phase * 0.5) * 0.06 * this.energy;
    this.lean += (leanTarget - this.lean) * clamp(dt * 4);

    /* نوسان سر */
    this.headNod += (
      (asleep ? 0.25 : Math.sin(this.phase * 1.2) * 0.12 * this.energy)
      - this.headNod
    ) * clamp(dt * 8);

    const headTiltT = asleep ? 0.35 : Math.sin(this.phase * 0.35 + 1) * 0.12 * this.energy;
    this.headTilt += (headTiltT - this.headTilt) * clamp(dt * 4);

    /* دنباله */
    for (let i = 0; i < 3; i++) {
      const s = Math.sin(this.phase * 0.6 + i * 0.7 + t * 0.5) * (0.25 + this.energy * 0.6);
      this.tailSegs[i] += (s - this.tailSegs[i]) * clamp(dt * (3 - i * 0.6));
    }

    /* دست‌ها و پاها بر اساس نقش */
    this.updateRole(dt, t, A, style, asleep);

    /* چهره */
    if (this.role === 'vocal') {
      // لب خواننده از A.vocal پیروی می‌کند (نه از انرژی)
      const env = A.vocal > 0.15 ? clamp(A.vocal * 1.6 + A.rms * 1.5) : 0;
      this.mouthOpen += (env - this.mouthOpen) * clamp(dt * (env > this.mouthOpen ? 20 : 14));
    } else {
      this.mouthOpen += (0 - this.mouthOpen) * clamp(dt * 6);
    }
    this.eyeShut += ((asleep ? 1 : 0) - this.eyeShut) * clamp(dt * 3);
    // پلک زدن
    this.blinkT += dt;
    if (this.blinkT > rand(2.5, 4.5)) { this.blinkT = 0; }
    this.earL += (Math.sin(t * 2.2 + this.index) * 0.1 - this.earL) * clamp(dt * 2);
    this.earR += (Math.sin(t * 2.0 + this.index + 1) * 0.1 - this.earR) * clamp(dt * 2);
  }

  /* رفتار اختصاصی هر نقش */
  updateRole(dt, t, A, style, asleep) {
    const e = this.energy;
    const p = this.phase;

    switch (this.role) {
      case 'guitar': {
        // دست چپ روی فرت، دست راست می‌زند (یا اسکن)
        const strumRate = 1 + A.sEnergy * 2;
        this.strumCycle += dt * strumRate * (A.hasBpm ? A.bpm / 60 : 1.5);
        const strumPhase = Math.sin(this.strumCycle * Math.PI * 2);
        // چپ: بالا روی فرت
        this.armL = -1.4 + Math.sin(p * 0.5) * 0.15 * e;
        this.elbowL = 0.9 + Math.sin(p * 0.7) * 0.1;
        // راست: نوازش بالا-پایین
        this.armR = 0.3 + strumPhase * 0.35 * (0.5 + e);
        this.elbowR = -0.6 + strumPhase * 0.2;
        break;
      }
      case 'drums': {
        // دو دست به‌تناوب روی کیت
        const hitRate = 1 + A.sEnergy * 3;
        this.hitL += dt * hitRate * 2;
        this.hitR += dt * hitRate * 2 + 0.5;
        const sl = Math.sin(this.hitL * Math.PI * 2);
        const sr = Math.sin(this.hitR * Math.PI * 2);
        this.armL = -0.9 + sl * 0.5;
        this.elbowL = 0.9 + Math.abs(sl) * 0.3;
        this.armR = 0.9 - sr * 0.5;
        this.elbowR = -0.9 - Math.abs(sr) * 0.3;
        break;
      }
      case 'vocal': {
        // دست آزاد به سمت بالا، دست دیگر میکروفون
        this.armL = -1.6 - Math.sin(p * 0.5) * 0.25 * e;     // میکروفون به دهن
        this.elbowL = 1.15;
        this.armR = 0.6 + Math.sin(p * 0.4 + 0.5) * 0.4 * e; // دست آزاد
        this.elbowR = -0.7;
        break;
      }
      case 'keys': {
        // دو دست روی کیبورد، انگشت‌ها بالا-پایین
        const kRate = 1.2 + A.sEnergy * 2;
        this.keyIdx += dt * kRate;
        this.armL = -1.1 + Math.sin(this.keyIdx * 4) * 0.12 * e;
        this.elbowL = 0.95 + Math.sin(this.keyIdx * 4 + 1) * 0.1;
        this.armR = 1.1 - Math.sin(this.keyIdx * 4 + 1.7) * 0.12 * e;
        this.elbowR = -0.95 - Math.sin(this.keyIdx * 4 + 2) * 0.1;
        break;
      }
      case 'bass': {
        // شبیه گیتار ولی آرام‌تر
        const strumRate = 1 + A.sEnergy * 1.2;
        this.strumCycle += dt * strumRate * (A.hasBpm ? A.bpm / 60 : 1.2);
        const ph = Math.sin(this.strumCycle * Math.PI * 2);
        this.armL = -1.3 + Math.sin(p * 0.4) * 0.1;
        this.elbowL = 0.85;
        this.armR = 0.5 + ph * 0.25 * (0.5 + e);
        this.elbowR = -0.7 + ph * 0.15;
        break;
      }
    }
    if (asleep) {
      this.armL = -0.4; this.elbowL = 0.4;
      this.armR = 0.4;  this.elbowR = -0.4;
    }
  }

  /* ============================================================
     رسم گربه (اسکلت به‌هم‌پیوسته - هیچ عضوی جدا نمی‌شود)
     تمام اندام‌ها از هیپ و شانه محاسبه می‌شوند و به هم چسبیده‌اند
     ============================================================ */
  draw(g, style, t) {
    const c = this.cfg;
    const col = this.colors;
    const S = this.scale;
    const legLen = c.legLen;
    const bodyH = c.bodyH;
    const bodyW = c.bodyW;
    const headR = c.headR;

    /* موقعیت پای گربه روی زمین */
    g.save();
    g.translate(this.x, this.y);
    g.scale(S, S);

    /* اسکواش عمودی حول نقطه‌ی زمین */
    const sq = this.squash;
    g.scale(1 / sq, sq);

    /* سایه */
    const shadowScale = 1 + this.jump * 0.6;
    g.fillStyle = 'rgba(0,0,0,0.4)';
    g.beginPath();
    g.ellipse(0, 0, bodyW * 0.62 * shadowScale, 0.055 * shadowScale, 0, 0, 7);
    g.fill();

    /* هیپ (نقطه‌ی اتصال همه چیز) */
    const jumpY = -this.jump;
    const hipY = -legLen - jumpY;
    const hipX = 0;

    /* ---------- پاها ---------- */
    drawLeg(g, col, hipX - bodyW * 0.28, hipY, 0, 0, c);
    drawLeg(g, col, hipX + bodyW * 0.28, hipY, 0, 0, c);

    /* ---------- دنباله (از هیپ به عقب) ---------- */
    drawTail(g, col, c, this.tailSegs, hipX + bodyW * 0.3, hipY - bodyH * 0.05);

    /* ---------- بدن (چرخش کل بالا‌تنه حول هیپ) ---------- */
    g.save();
    g.translate(hipX, hipY);
    g.rotate(this.lean + this.headNod * 0.1);
    g.translate(0, -bodyH * 0.42);

    /* شکم */
    g.fillStyle = col.body;
    g.beginPath();
    g.ellipse(0, 0, bodyW * 0.5, bodyH * 0.48, 0, 0, 7);
    g.fill();
    g.fillStyle = col.belly;
    g.beginPath();
    g.ellipse(0, bodyH * 0.1, bodyW * 0.28, bodyH * 0.36, 0, 0, 7);
    g.fill();

    /* الگو */
    drawPattern(g, this, col, bodyW, bodyH);

    /* لباس (قبل از دست‌ها، پشت آن‌ها) */
    drawClothes(g, this, style, bodyW, bodyH);

    /* ---------- دست‌ها (از شانه‌ها روی بدنه) ---------- */
    const shLX = -bodyW * 0.42;
    const shRX = bodyW * 0.42;
    const shY  = -bodyH * 0.25;

    const armL = solveArm(shLX, shY, this.armL, this.elbowL, 0.34, 0.30);
    const armR = solveArm(shRX, shY, this.armR, this.elbowR, 0.34, 0.30);

    // دست پشتی (چپ = به سمت دور تصویر)
    drawArm(g, col, armL);
    // ساز در جلوی سینه
    drawInstrument(g, this, style, armL, armR, bodyW, bodyH);
    // دست جلو (راست)
    drawArm(g, col, armR);

    /* ---------- سر (متصل به بالای بدن) ---------- */
    g.save();
    g.translate(0, -bodyH * 0.6);
    g.rotate(this.headTilt);
    g.translate(0, -headR * 0.7);
    drawHead(g, this, col, headR, t);
    g.restore();

    g.restore(); // پایان چرخش بدن
    g.restore(); // پایان ترنسفورم گربه
  }
}

/* ============================================================
   ۵. توابع کمکی رسم (اندام‌های به‌هم‌پیوسته)
   ============================================================ */

/* پا: از هیپ تا زمین با یک خم کوچک */
function drawLeg(g, col, hipX, hipY, footX, footY, c) {
  // زانو کمی به بیرون می‌شکند
  const kx = lerp(hipX, footX, 0.5) + (footX - hipX) * 0.1;
  const ky = lerp(hipY, footY, 0.5);
  g.strokeStyle = col.body;
  g.lineWidth = 0.14;
  g.lineCap = 'round';
  g.beginPath();
  g.moveTo(hipX, hipY);
  g.quadraticCurveTo(kx, ky, footX, footY - 0.02);
  g.stroke();
  // کف پا
  g.fillStyle = col.belly;
  g.beginPath();
  g.ellipse(footX, footY - 0.035, 0.09, 0.05, 0, 0, 7);
  g.fill();
}

/* دنباله: ۳ بند از هیپ به عقب */
function drawTail(g, col, c, segs, tx, ty) {
  let x = tx, y = ty;
  let a = -0.5;
  g.strokeStyle = col.body;
  g.lineCap = 'round';
  g.lineWidth = c.tailType === 'stub' ? 0.15 : 0.10;

  g.beginPath();
  g.moveTo(x, y);

  const N = c.tailType === 'stub' ? 1 : 3;
  for (let i = 0; i < N; i++) {
    const len = (c.tailType === 'stub' ? 0.18 : 0.22 - i * 0.02);
    a += (segs[i] || 0) * 0.7;
    x += Math.cos(a) * len;
    y += Math.sin(a) * len;
    g.lineTo(x, y);
  }
  g.stroke();
}

/* دست: two-bone با زاویه‌ی شانه و آرنج */
function solveArm(sx, sy, a1, a2, upper, fore) {
  const ex = sx + Math.cos(a1) * upper;
  const ey = sy + Math.sin(a1) * upper;
  const hx = ex + Math.cos(a1 + a2) * fore;
  const hy = ey + Math.sin(a1 + a2) * fore;
  return { sx, sy, ex, ey, hx, hy };
}
function drawArm(g, col, arm) {
  g.strokeStyle = col.body;
  g.lineWidth = 0.1;
  g.lineCap = 'round';
  g.beginPath();
  g.moveTo(arm.sx, arm.sy);
  g.lineTo(arm.ex, arm.ey);
  g.lineTo(arm.hx, arm.hy);
  g.stroke();
  // پنجه
  g.fillStyle = col.belly;
  g.beginPath();
  g.arc(arm.hx, arm.hy, 0.06, 0, 7);
  g.fill();
}

/* الگوهای خز */
function drawPattern(g, cat, col, bodyW, bodyH) {
  if (cat.cfg.pattern === 'tabby') {
    g.strokeStyle = col.dark;
    g.lineWidth = 0.028;
    for (let i = -1; i <= 1; i++) {
      g.beginPath();
      g.moveTo(-bodyW * 0.5 + 0.02, -bodyH * 0.5 + i * 0.14);
      g.quadraticCurveTo(-bodyW * 0.35, -bodyH * 0.46 + i * 0.14, -bodyW * 0.22, -bodyH * 0.5 + i * 0.14);
      g.stroke();
    }
  } else if (cat.cfg.pattern === 'calico') {
    g.fillStyle = col.dark;
    g.beginPath(); g.ellipse(-bodyW * 0.25, -bodyH * 0.1, 0.1, 0.09, 0, 0, 7); g.fill();
    g.fillStyle = '#d98e4a';
    g.beginPath(); g.ellipse(bodyW * 0.28, bodyH * 0.1, 0.09, 0.08, 0, 0, 7); g.fill();
  } else if (cat.cfg.pattern === 'tux') {
    g.fillStyle = '#f6f6f4';
    g.beginPath();
    g.ellipse(0, bodyH * 0.2, bodyW * 0.28, bodyH * 0.3, 0, 0, 7);
    g.fill();
    g.beginPath();
    g.moveTo(0, -bodyH * 0.5);
    g.lineTo(-0.08, 0);
    g.lineTo(0.08, 0);
    g.closePath();
    g.fill();
  }
}

/* لباس بر اساس سبک */
function drawClothes(g, cat, style, bodyW, bodyH) {
  const cl = style.clothes;
  if (!cl) return;
  g.save();

  if (cl.type === 'leather') {
    // کاپشن چرم مشکی روی بدن
    g.fillStyle = cl.color;
    g.beginPath();
    g.ellipse(0, bodyH * 0.05, bodyW * 0.5, bodyH * 0.4, 0, 0, 7);
    g.fill();
    // یقه
    g.fillStyle = '#2a2a2a';
    g.beginPath();
    g.moveTo(-bodyW * 0.3, -bodyH * 0.3);
    g.lineTo(0, -bodyH * 0.15);
    g.lineTo(bodyW * 0.3, -bodyH * 0.3);
    g.lineTo(bodyW * 0.15, -bodyH * 0.35);
    g.lineTo(0, -bodyH * 0.22);
    g.lineTo(-bodyW * 0.15, -bodyH * 0.35);
    g.closePath();
    g.fill();
    // میخ‌های فلزی
    g.fillStyle = cl.accent;
    for (let i = -1; i <= 1; i++) {
      g.beginPath();
      g.arc(i * bodyW * 0.18, bodyH * 0.28, 0.015, 0, 7);
      g.fill();
    }
    // شلوار جین پاره (پایین‌تنه)
    g.fillStyle = '#3b4a66';
    g.beginPath();
    g.ellipse(0, bodyH * 0.35, bodyW * 0.42, bodyH * 0.12, 0, 0, 7);
    g.fill();
  } else if (cl.type === 'tshirt') {
    g.fillStyle = cl.color;
    g.beginPath();
    g.ellipse(0, bodyH * 0.08, bodyW * 0.46, bodyH * 0.36, 0, 0, 7);
    g.fill();
    // یقه سفید
    g.strokeStyle = cl.accent;
    g.lineWidth = 0.03;
    g.beginPath();
    g.arc(0, -bodyH * 0.22, bodyW * 0.2, 0.15 * Math.PI, 0.85 * Math.PI);
    g.stroke();
  } else if (cl.type === 'tuxedo') {
    // کت و شلوار مشکی
    g.fillStyle = cl.color;
    g.beginPath();
    g.ellipse(0, bodyH * 0.08, bodyW * 0.46, bodyH * 0.4, 0, 0, 7);
    g.fill();
    // پیراهن سفید
    g.fillStyle = cl.accent;
    g.beginPath();
    g.moveTo(-bodyW * 0.18, -bodyH * 0.3);
    g.lineTo(bodyW * 0.18, -bodyH * 0.3);
    g.lineTo(bodyW * 0.14, bodyH * 0.3);
    g.lineTo(-bodyW * 0.14, bodyH * 0.3);
    g.closePath();
    g.fill();
    // پاپیون
    g.fillStyle = '#000';
    const by = -bodyH * 0.28;
    g.beginPath();
    g.moveTo(0, by); g.lineTo(-0.05, by - 0.03); g.lineTo(-0.05, by + 0.03);
    g.closePath();
    g.moveTo(0, by); g.lineTo(0.05, by - 0.03); g.lineTo(0.05, by + 0.03);
    g.closePath();
    g.fill();
  } else if (cl.type === 'suit') {
    g.fillStyle = cl.color;
    g.beginPath();
    g.ellipse(0, bodyH * 0.08, bodyW * 0.48, bodyH * 0.4, 0, 0, 7);
    g.fill();
    // یقه‌ی کت
    g.strokeStyle = cl.accent;
    g.lineWidth = 0.02;
    g.beginPath();
    g.moveTo(-bodyW * 0.2, -bodyH * 0.28);
    g.lineTo(0, -bodyH * 0.05);
    g.lineTo(bodyW * 0.2, -bodyH * 0.28);
    g.stroke();
  } else if (cl.type === 'neon') {
    g.fillStyle = cl.color;
    g.beginPath();
    g.ellipse(0, bodyH * 0.08, bodyW * 0.46, bodyH * 0.36, 0, 0, 7);
    g.fill();
    // نوارهای نئون
    g.strokeStyle = cl.accent;
    g.lineWidth = 0.025;
    for (let i = -1; i <= 1; i++) {
      g.beginPath();
      g.moveTo(-bodyW * 0.4, bodyH * 0.05 + i * 0.12);
      g.lineTo(bodyW * 0.4, bodyH * 0.05 + i * 0.12);
      g.stroke();
    }
  } else if (cl.type === 'hoodie') {
    g.fillStyle = cl.color;
    g.beginPath();
    g.ellipse(0, bodyH * 0.1, bodyW * 0.5, bodyH * 0.4, 0, 0, 7);
    g.fill();
    // کلاه (پشت سر)
    g.fillStyle = cl.color;
    g.beginPath();
    g.ellipse(0, -bodyH * 0.35, bodyW * 0.34, bodyH * 0.15, 0, 0, 7);
    g.fill();
    // زنجیر
    g.strokeStyle = cl.accent;
    g.lineWidth = 0.025;
    g.beginPath();
    g.arc(0, -bodyH * 0.05, bodyW * 0.25, 0.15 * Math.PI, 0.85 * Math.PI);
    g.stroke();
    g.fillStyle = cl.accent;
    g.beginPath();
    g.arc(0, bodyH * 0.15, 0.03, 0, 7);
    g.fill();
  }
  g.restore();
}

/* ساز در دست گربه */
function drawInstrument(g, cat, style, armL, armR, bodyW, bodyH) {
  const role = cat.role;
  const gtr = style.guitar;

  if (role === 'guitar' && gtr) {
    drawGuitar(g, gtr, armL, armR, cat, style);
  } else if (role === 'bass' && gtr) {
    drawGuitar(g, 'bass', armL, armR, cat, style);
  } else if (role === 'drums') {
    drawDrumKit(g, cat, bodyW, bodyH);
  } else if (role === 'vocal') {
    drawMic(g, armL);
  } else if (role === 'keys' && style.hasPiano) {
    drawKeyboard(g, cat, armL, armR, bodyW);
  } else if (role === 'keys' && !style.hasPiano) {
    // در سبک بدون پیانو → جایگزین: سینت‌استند یا آمپ
    drawAmp(g, bodyW);
  }
  // آمپ راک در کنار
  if (style.hasAmp && role === 'guitar') {
    // (آمپ فقط برای گیتاریست)
  }
}

function drawGuitar(g, kind, armL, armR, cat, style) {
  // بدنه‌ی گیتار بین دست چپ (فرت) و دست راست (اسکن)
  const handL = { x: armL.hx, y: armL.hy };
  const handR = { x: armR.hx, y: armR.hy };
  // مرکز گیتار بین دو دست، کمی پایین‌تر
  const cx = (handL.x * 0.35 + handR.x * 0.65);
  const cy = (handL.y * 0.35 + handR.y * 0.65) + 0.08;
  // زاویه‌ی گیتار نسبت به خط بین دو دست
  const ang = Math.atan2(handR.y - handL.y, handR.x - handL.x);

  g.save();
  g.translate(cx, cy);
  g.rotate(ang * 0.7);

  if (kind === 'electric') {
    // بدنه‌ی چوبی مشکی، دو کات‌اُوِی
    g.fillStyle = '#1a1a1a';
    g.strokeStyle = '#000';
    g.lineWidth = 0.015;
    g.beginPath();
    g.moveTo(-0.15, 0.02);
    g.bezierCurveTo(-0.18, -0.08, -0.05, -0.14, 0.02, -0.12);
    g.bezierCurveTo(0.08, -0.14, 0.2, -0.08, 0.2, 0.02);
    g.bezierCurveTo(0.22, 0.08, 0.08, 0.14, 0, 0.12);
    g.bezierCurveTo(-0.08, 0.14, -0.18, 0.08, -0.15, 0.02);
    g.closePath();
    g.fill(); g.stroke();
    // پیکاپ‌ها
    g.fillStyle = '#c8c8c8';
    g.fillRect(-0.05, -0.02, 0.04, 0.04);
    g.fillRect(0.0, -0.02, 0.04, 0.04);
    // نِک
    g.fillStyle = '#3a2a1f';
    g.fillRect(0.17, -0.02, 0.4, 0.04);
    // فرت‌ها
    g.strokeStyle = '#e0d0a0';
    g.lineWidth = 0.005;
    for (let i = 0; i < 6; i++) {
      g.beginPath();
      g.moveTo(0.2 + i * 0.06, -0.02);
      g.lineTo(0.2 + i * 0.06, 0.02);
      g.stroke();
    }
  } else if (kind === 'acoustic') {
    g.fillStyle = '#d9a86a';
    g.strokeStyle = '#5a3a1a';
    g.lineWidth = 0.012;
    g.beginPath();
    g.ellipse(0, 0, 0.16, 0.12, 0, 0, 7);
    g.fill(); g.stroke();
    // سوراخ صدا
    g.fillStyle = '#2a1a10';
    g.beginPath(); g.arc(0.01, 0, 0.03, 0, 7); g.fill();
    // نِک
    g.fillStyle = '#7a5a3a';
    g.fillRect(0.15, -0.02, 0.42, 0.04);
    for (let i = 0; i < 6; i++) {
      g.beginPath();
      g.moveTo(0.2 + i * 0.06, -0.02);
      g.lineTo(0.2 + i * 0.06, 0.02);
      g.stroke();
    }
  } else if (kind === 'classical') {
    g.fillStyle = '#e0b878';
    g.strokeStyle = '#6a4a20';
    g.lineWidth = 0.012;
    g.beginPath();
    g.ellipse(0, 0, 0.17, 0.13, 0, 0, 7);
    g.fill(); g.stroke();
    g.fillStyle = '#2a1a10';
    g.beginPath(); g.arc(0.01, 0, 0.032, 0, 7); g.fill();
    g.fillStyle = '#5a3a1a';
    g.fillRect(0.16, -0.02, 0.42, 0.04);
  } else if (kind === 'jazz') {
    // hollow body با f-hole
    g.fillStyle = '#8a4a1a';
    g.strokeStyle = '#3a2010';
    g.lineWidth = 0.012;
    g.beginPath();
    g.ellipse(0, 0, 0.17, 0.13, 0, 0, 7);
    g.fill(); g.stroke();
    // f-hole
    g.strokeStyle = '#000';
    g.lineWidth = 0.008;
    g.beginPath();
    g.moveTo(-0.08, -0.04); g.quadraticCurveTo(-0.06, 0, -0.08, 0.04);
    g.stroke();
    g.beginPath();
    g.moveTo(0.08, -0.04); g.quadraticCurveTo(0.06, 0, 0.08, 0.04);
    g.stroke();
    g.fillStyle = '#3a2a1a';
    g.fillRect(0.16, -0.02, 0.42, 0.04);
  } else if (kind === 'bass') {
    g.fillStyle = '#1a1a1a';
    g.strokeStyle = '#000';
    g.lineWidth = 0.015;
    g.beginPath();
    g.moveTo(-0.16, 0.02);
    g.bezierCurveTo(-0.2, -0.1, -0.05, -0.15, 0.02, -0.13);
    g.bezierCurveTo(0.1, -0.15, 0.22, -0.1, 0.22, 0.02);
    g.bezierCurveTo(0.24, 0.09, 0.08, 0.14, 0, 0.12);
    g.bezierCurveTo(-0.08, 0.14, -0.2, 0.09, -0.16, 0.02);
    g.closePath();
    g.fill(); g.stroke();
    g.fillStyle = '#c8c8c8';
    g.fillRect(-0.05, -0.02, 0.05, 0.04);
    g.fillRect(0.01, -0.02, 0.05, 0.04);
    g.fillStyle = '#3a2a1f';
    g.fillRect(0.19, -0.025, 0.45, 0.05);
    g.strokeStyle = '#e0d0a0';
    g.lineWidth = 0.005;
    for (let i = 0; i < 5; i++) {
      g.beginPath();
      g.moveTo(0.22 + i * 0.08, -0.025);
      g.lineTo(0.22 + i * 0.08, 0.025);
      g.stroke();
    }
  } else if (kind === 'synth') {
    // کیبورد سینتی روی گردن
    g.fillStyle = '#1a1030';
    g.strokeStyle = '#20e0ff';
    g.lineWidth = 0.015;
    g.beginPath();
    g.ellipse(0, 0, 0.18, 0.1, 0, 0, 7);
    g.fill(); g.stroke();
    g.fillStyle = '#20e0ff';
    for (let i = 0; i < 8; i++) {
      g.fillRect(-0.15 + i * 0.038, -0.03, 0.02, 0.06);
    }
  }
  g.restore();
}

function drawDrumKit(g, cat, bodyW, bodyH) {
  // کیت درام کوچک در مقابل درامر، پایین قاب
  const bx = 0;
  const by = -0.05; // نزدیک زمین
  g.save();
  g.translate(bx, by);

  // بیس درام
  g.fillStyle = '#8a2a20';
  g.strokeStyle = '#000';
  g.lineWidth = 0.02;
  g.beginPath();
  g.arc(0, -0.08, 0.14, 0, 7);
  g.fill(); g.stroke();
  g.fillStyle = '#fff5d8';
  g.beginPath(); g.arc(0, -0.08, 0.05, 0, 7); g.fill();

  // دو توم روی بیس
  g.fillStyle = '#c88a3a';
  g.beginPath();
  g.ellipse(-0.18, -0.22, 0.09, 0.05, 0, 0, 7);
  g.fill(); g.stroke();
  g.beginPath();
  g.ellipse(0.05, -0.24, 0.09, 0.05, 0, 0, 7);
  g.fill(); g.stroke();

  // های‌هت
  g.fillStyle = '#c8a860';
  g.beginPath();
  g.ellipse(-0.32, -0.32, 0.06, 0.02, 0, 0, 7);
  g.fill(); g.stroke();

  // سنج
  g.fillStyle = '#e0c060';
  g.beginPath();
  g.ellipse(0.3, -0.36, 0.09, 0.02, 0, 0, 7);
  g.fill(); g.stroke();

  g.restore();
}

function drawMic(g, armL) {
  // میکروفون در دست چپ
  const hx = armL.hx, hy = armL.hy;
  g.save();
  g.translate(hx, hy - 0.06);
  g.rotate(-0.4);
  // بدنه
  g.fillStyle = '#333';
  g.strokeStyle = '#000';
  g.lineWidth = 0.012;
  g.beginPath();
  g.roundRect(-0.03, -0.14, 0.06, 0.16, 0.02);
  g.fill(); g.stroke();
  // سر میکروفون
  g.fillStyle = '#888';
  g.beginPath();
  g.ellipse(0, -0.16, 0.045, 0.04, 0, 0, 7);
  g.fill(); g.stroke();
  // خطوط
  g.strokeStyle = '#aaa';
  g.lineWidth = 0.005;
  for (let i = 0; i < 4; i++) {
    g.beginPath();
    g.moveTo(-0.04, -0.17 + i * 0.01);
    g.lineTo(0.04, -0.17 + i * 0.01);
    g.stroke();
  }
  g.restore();
}

function drawKeyboard(g, cat, armL, armR, bodyW) {
  // کیبورد در مقابل پیانیست
  const y = -0.05;
  g.save();
  g.translate(0, y);
  // بدنه
  g.fillStyle = '#2a1a10';
  g.strokeStyle = '#000';
  g.lineWidth = 0.015;
  g.beginPath();
  g.roundRect(-bodyW * 0.6, -0.12, bodyW * 1.2, 0.14, 0.02);
  g.fill(); g.stroke();
  // کلیدهای سفید
  g.fillStyle = '#f1e4cc';
  const N = 12;
  for (let i = 0; i < N; i++) {
    g.fillRect(-bodyW * 0.55 + i * (bodyW * 1.1 / N), -0.10, (bodyW * 1.1 / N) - 0.006, 0.10);
  }
  // کلیدهای سیاه
  g.fillStyle = '#000';
  for (let i = 0; i < N; i++) {
    if (i % 7 === 2 || i % 7 === 6) continue;
    if (i % 2 === 1) {
      g.fillRect(-bodyW * 0.55 + i * (bodyW * 1.1 / N) + 0.008, -0.10, (bodyW * 1.1 / N) * 0.55, 0.06);
    }
  }
  g.restore();
}

function drawAmp(g, bodyW) {
  g.save();
  g.translate(bodyW * 0.7, -0.1);
  g.fillStyle = '#151515';
  g.strokeStyle = '#000';
  g.lineWidth = 0.015;
  g.beginPath();
  g.roundRect(-0.14, -0.2, 0.28, 0.24, 0.02);
  g.fill(); g.stroke();
  // توری
  g.fillStyle = '#3a3a3a';
  g.beginPath();
  g.roundRect(-0.12, -0.18, 0.24, 0.16, 0.01);
  g.fill();
  g.strokeStyle = '#666';
  g.lineWidth = 0.004;
  for (let i = 0; i < 8; i++) {
    g.beginPath();
    g.moveTo(-0.12, -0.17 + i * 0.02);
    g.lineTo(0.12, -0.17 + i * 0.02);
    g.stroke();
  }
  // پنل
  g.fillStyle = '#c9a961';
  g.beginPath();
  g.arc(0.06, -0.02, 0.015, 0, 7);
  g.fill();
  g.restore();
}

/* سر گربه: گوش، چشم، بینی، دهن، سبیل، اکسسوری سبک */
function drawHead(g, cat, col, r, t) {
  const style = cat._style || STYLES.rock;
  const asleep = cat.eyeShut > 0.7;

  /* گوش‌ها (پشت سر) */
  g.fillStyle = col.body;
  for (let s = -1; s <= 1; s += 2) {
    g.save();
    g.translate(s * r * 0.65, -r * 0.7);
    g.rotate(s * (0.1 + (s < 0 ? cat.earL : cat.earR)));
    if (cat.cfg.earType === 'point') {
      g.beginPath();
      g.moveTo(-r * 0.3, r * 0.4);
      g.lineTo(0, -r * 0.65);
      g.lineTo(r * 0.3, r * 0.4);
      g.closePath();
      g.fill();
      // داخل گوش
      g.fillStyle = '#f2a3a8';
      g.beginPath();
      g.moveTo(-r * 0.16, r * 0.28);
      g.lineTo(0, -r * 0.42);
      g.lineTo(r * 0.16, r * 0.28);
      g.closePath();
      g.fill();
    } else {
      // گوش تاشو (اسکاتیش)
      g.beginPath();
      g.ellipse(0, 0, r * 0.28, r * 0.22, 0, 0, 7);
      g.fill();
    }
    g.restore();
  }

  /* سر */
  g.fillStyle = col.body;
  g.beginPath();
  g.ellipse(0, 0, r * 1.12, r, 0, 0, 7);
  g.fill();

  /* پوزه روشن */
  g.fillStyle = col.belly;
  g.beginPath();
  g.ellipse(0, r * 0.35, r * 0.55, r * 0.42, 0, 0, 7);
  g.fill();

  /* الگوی تکسیدو روی صورت */
  if (cat.cfg.pattern === 'tux') {
    g.fillStyle = '#f6f6f4';
    g.beginPath();
    g.moveTo(0, -r * 0.9);
    g.lineTo(-r * 0.14, r * 0.1);
    g.lineTo(r * 0.14, r * 0.1);
    g.closePath();
    g.fill();
  }
  /* الگوی کالیکو */
  if (cat.cfg.pattern === 'calico') {
    g.fillStyle = col.dark;
    g.beginPath();
    g.ellipse(-r * 0.6, -r * 0.3, r * 0.45, r * 0.4, 0, 0, 7);
    g.fill();
    g.fillStyle = '#d98e4a';
    g.beginPath();
    g.ellipse(r * 0.6, -r * 0.5, r * 0.32, r * 0.28, 0, 0, 7);
    g.fill();
  }
  /* خطوط تابی روی پیشانی */
  if (cat.cfg.pattern === 'tabby') {
    g.strokeStyle = col.dark;
    g.lineWidth = 0.02;
    for (const x of [-0.05, 0, 0.05]) {
      g.beginPath();
      g.moveTo(x * r / 0.05 * 0.05, -r * 0.9);
      g.lineTo(x * r / 0.05 * 0.05, -r * 0.55);
      g.stroke();
    }
  }

  /* چشم‌ها */
  const blink = cat.blinkT > 3.9 && cat.blinkT < 4.05;
  const eyeY = -r * 0.05;
  const eyeR = r * 0.17;
  for (let s = -1; s <= 1; s += 2) {
    const ex = s * r * 0.42;
    if (asleep || blink) {
      g.strokeStyle = '#1c1410';
      g.lineWidth = 0.02;
      g.beginPath();
      g.arc(ex, eyeY, eyeR, 0.15, Math.PI - 0.15);
      g.stroke();
    } else {
      // سفیدی
      g.fillStyle = '#fff';
      g.beginPath();
      g.ellipse(ex, eyeY, eyeR, eyeR * 1.15, 0, 0, 7);
      g.fill();
      // مردمک (بسته به سبک رنگ)
      const pupilCol = cat.cfg.pattern === 'tux' ? '#9be15d' : '#1c1410';
      g.fillStyle = pupilCol;
      g.beginPath();
      g.ellipse(ex, eyeY, eyeR * 0.55, eyeR * 0.95, 0, 0, 7);
      g.fill();
      // برق
      g.fillStyle = '#fff';
      g.beginPath();
      g.arc(ex + r * 0.04, eyeY - r * 0.05, r * 0.05, 0, 7);
      g.fill();
    }
  }

  /* بینی */
  g.fillStyle = '#f27c8c';
  g.beginPath();
  g.moveTo(-r * 0.05, r * 0.22);
  g.lineTo(r * 0.05, r * 0.22);
  g.lineTo(0, r * 0.3);
  g.closePath();
  g.fill();

  /* دهان (خواننده = متحرک، بقیه = خط ثابت) */
  const isSinger = cat.role === 'vocal';
  if (isSinger) {
    // دهان باز بر اساس mouthOpen
    const m = cat.mouthOpen;
    if (m > 0.08) {
      g.fillStyle = '#7a1220';
      g.beginPath();
      g.ellipse(0, r * 0.5, r * 0.16, r * 0.12 + m * r * 0.15, 0, 0, 7);
      g.fill();
      // زبان
      g.fillStyle = '#e06070';
      g.beginPath();
      g.ellipse(0, r * 0.56 + m * r * 0.1, r * 0.1, r * 0.05 + m * r * 0.06, 0, 0, 7);
      g.fill();
      // خط لب بالا
      g.strokeStyle = '#1c1410';
      g.lineWidth = 0.012;
      g.beginPath();
      g.arc(0, r * 0.42, r * 0.18, Math.PI + 0.2, -0.2);
      g.stroke();
    } else {
      g.strokeStyle = '#1c1410';
      g.lineWidth = 0.018;
      g.beginPath();
      g.arc(-r * 0.1, r * 0.42, r * 0.13, 0.1, Math.PI - 0.1);
      g.stroke();
      g.beginPath();
      g.arc(r * 0.1, r * 0.42, r * 0.13, 0.1, Math.PI - 0.1);
      g.stroke();
    }
  } else {
    g.strokeStyle = '#1c1410';
    g.lineWidth = 0.018;
    g.beginPath();
    g.arc(-r * 0.1, r * 0.42, r * 0.13, 0.1, Math.PI - 0.1);
    g.stroke();
    g.beginPath();
    g.arc(r * 0.1, r * 0.42, r * 0.13, 0.1, Math.PI - 0.1);
    g.stroke();
  }

  /* سبیل */
  g.strokeStyle = '#fff9';
  g.lineWidth = 0.01;
  for (let s = -1; s <= 1; s += 2) {
    for (let j = -1; j <= 1; j++) {
      g.beginPath();
      g.moveTo(s * r * 0.55, r * 0.3 + j * 0.03);
      g.lineTo(s * r * 1.25, r * 0.26 + j * 0.06);
      g.stroke();
    }
  }

  /* اکسسوری سبک */
  drawHeadAccessory(g, cat, r, style);
}

function drawHeadAccessory(g, cat, r, style) {
  const acc = style.clothes.accessory;

  // نقش «خواننده» همیشه تاج دارد
  if (cat.role === 'vocal') {
    g.fillStyle = '#ffd24a';
    g.strokeStyle = '#b88a10';
    g.lineWidth = 0.012;
    g.beginPath();
    g.moveTo(-r * 0.55, -r * 0.9);
    g.lineTo(-r * 0.55, -r * 1.4);
    g.lineTo(-r * 0.28, -r * 1.15);
    g.lineTo(0, -r * 1.6);
    g.lineTo(r * 0.28, -r * 1.15);
    g.lineTo(r * 0.55, -r * 1.4);
    g.lineTo(r * 0.55, -r * 0.9);
    g.closePath();
    g.fill(); g.stroke();
    // جواهر
    g.fillStyle = '#e0364f';
    g.beginPath(); g.arc(0, -r * 1.15, r * 0.06, 0, 7); g.fill();
  }

  if (acc === 'bowtie') {
    const y = -r * 0.95;
    g.fillStyle = '#000';
    g.beginPath();
    g.moveTo(0, y); g.lineTo(-r * 0.18, y - r * 0.1); g.lineTo(-r * 0.18, y + r * 0.1);
    g.closePath();
    g.moveTo(0, y); g.lineTo(r * 0.18, y - r * 0.1); g.lineTo(r * 0.18, y + r * 0.1);
    g.closePath();
    g.fill();
  } else if (acc === 'headband') {
    g.fillStyle = '#fff';
    g.strokeStyle = '#000';
    g.lineWidth = 0.008;
    g.beginPath();
    g.rect(-r * 1.0, -r * 0.6, r * 2.0, r * 0.14);
    g.fill(); g.stroke();
  } else if (acc === 'fedora') {
    g.fillStyle = '#1a1414';
    g.beginPath();
    g.ellipse(0, -r * 0.85, r * 1.15, r * 0.2, 0, 0, 7);
    g.fill();
    g.fillStyle = '#2a2020';
    g.beginPath();
    g.roundRect(-r * 0.6, -r * 1.5, r * 1.2, r * 0.7, r * 0.1);
    g.fill();
    g.fillStyle = '#8a6a30';
    g.fillRect(-r * 0.6, -r * 1.05, r * 1.2, r * 0.12);
  } else if (acc === 'headset') {
    g.strokeStyle = '#20e0ff';
    g.lineWidth = 0.02;
    g.beginPath();
    g.arc(0, -r * 0.2, r * 1.05, Math.PI + 0.3, -0.3);
    g.stroke();
    g.fillStyle = '#20e0ff';
    g.beginPath(); g.arc(-r * 0.95, -r * 0.2, r * 0.18, 0, 7); g.fill();
    g.beginPath(); g.arc( r * 0.95, -r * 0.2, r * 0.18, 0, 7); g.fill();
  } else if (acc === 'chain') {
    // (روی گردن، در drawClothes کشیده شده)
  } else if (acc === 'studs') {
    // (روی یقه، در drawClothes کشیده شده)
  }
}

/* ============================================================
   ۶. صحنه و رندر
   ============================================================ */
const cv = $('#cv'), g = cv.getContext('2d');
const vu = $('#vu'), vg = vu.getContext('2d');
const stageEl = $('#stage');
const au = $('#au');

let W = 0, H = 0, D = 1;
function fitCanvas() {
  D = Math.min(devicePixelRatio || 1, 2);
  for (const c of [cv, vu]) {
    c.width = c.clientWidth * D;
    c.height = c.clientHeight * D;
  }
  W = cv.width / D;
  H = cv.height / D;
}
addEventListener('resize', fitCanvas);
fitCanvas();

/* گربه‌ها */
const CATS = CAT_DEFS.map((d, i) => new Cat(d, i));
/* ضریب تمپوی هر گربه: خواننده ۱، گیتار ۱، درام ۱.۵، کیبورد ۰.۷۵، بیس ۰.۵ */
const MULT = [1.0, 1.5, 1.0, 0.75, 0.5];
CATS.forEach((c, i) => { c.mult = MULT[i]; c.offset = i * 1.4; });

/* موتور و ذرات */
const A = new AudioEngine(au);
const parts = new Particles();

/* وضعیت UI */
const state = {
  style: 'rock',
  playing: false,
  showModal: false,
};

/* ============================================================
   ۷. حلقه‌ی رندر
   ============================================================ */
let lastT = performance.now();
let reel = 0;
let shakeAmount = 0;
let shakeX = 0, shakeY = 0;
let lastVib = 0;
let hueCur = null; // برای انتقال نرم رنگ

function chooseHue() {
  // رنگ آسمان صحنه: وابسته به سبک + انرژی
  const accentHue = { rock: 8, pop: 330, classic: 40, jazz: 25, electronic: 195, hiphop: 45 }[state.style];
  const energyShift = A.sEnergy * 30;
  return (accentHue + energyShift + 360) % 360;
}

function mood() {
  if (!state.playing || A.silence > 0.7) return ['خواب‌آلود', 230];
  if (state.style === 'rock' && A.sEnergy > 0.4) return ['خشن و طوفانی', 8];
  if (A.sEnergy > 0.5) return ['شاد و پرشور', chooseHue()];
  if (A.sEnergy > 0.25) return ['سرخوش', chooseHue()];
  return ['آرام و رؤیایی', 220];
}

function render(dt, t) {
  /* ---------- شیک ---------- */
  const style = STYLES[state.style];
  const fx = style.effects;
  const shk = state.playing && A.silence < 0.5
    ? (A.pulse * A.sEnergy * 12 * fx.shake + A.rock * 4) * (1 - A.silence)
    : 0;
  shakeAmount += (shk - shakeAmount) * clamp(dt * 12);
  shakeX = (Math.random() - 0.5) * shakeAmount;
  shakeY = (Math.random() - 0.5) * shakeAmount;

  /* ---------- بک‌گراند ---------- */
  g.setTransform(D, 0, 0, D, 0, 0);
  g.clearRect(0, 0, W, H);
  g.save();
  g.translate(shakeX, shakeY);

  const targetHue = chooseHue();
  if (hueCur === null) hueCur = targetHue;
  else hueCur += wrap((targetHue - hueCur) * Math.PI / 180) * 180 / Math.PI * clamp(dt * 1.5);
  const hu = hueCur;
  const eN = A.sEnergy;

  const bgGrad = g.createLinearGradient(0, 0, 0, H);
  bgGrad.addColorStop(0, `hsl(${hu} 40% ${5 + eN * 10}%)`);
  bgGrad.addColorStop(1, `hsl(${hu + 20} 35% ${11 + eN * 12}%)`);
  g.fillStyle = bgGrad;
  g.fillRect(-40, -40, W + 80, H + 80);

  /* زمین */
  g.fillStyle = `hsl(${hu} 25% 8%)`;
  g.fillRect(-40, H * 0.78, W + 80, H);

  /* خطوط زمین */
  g.strokeStyle = '#ffffff10';
  g.lineWidth = 1;
  for (let i = 0; i < 8; i++) {
    g.beginPath();
    g.moveTo(0, H * 0.8 + i * i * 2.2);
    g.lineTo(W, H * 0.8 + i * i * 2.2);
    g.stroke();
  }

  /* نورافکن‌ها (بدون چرخش دیوانه - فقط نوسان آرام) */
  g.globalCompositeOperation = 'lighter';
  const on = state.playing && A.silence < 0.4;
  for (let i = 0; i < 6; i++) {
    const x0 = W * (i + 0.5) / 6;
    const ang = Math.sin(t * (0.6 + i * 0.08) + i * 1.3) * (0.28 + 0.3 * eN);
    const wd = W * (0.05 + 0.05 * eN);
    const xe = x0 + Math.tan(ang) * H * 1.05;
    const beamHue = (hu + i * 38) % 360;
    const alpha = on ? (0.08 + 0.28 * eN + A.pulse * 0.28 * fx.shake) : 0.05;
    const gr = g.createLinearGradient(x0, 0, xe, H);
    gr.addColorStop(0, `hsla(${beamHue},95%,65%,${alpha})`);
    gr.addColorStop(1, `hsla(${beamHue},95%,60%,0)`);
    g.fillStyle = gr;
    g.beginPath();
    g.moveTo(x0 - 5, 0);
    g.lineTo(x0 + 5, 0);
    g.lineTo(xe + wd, H);
    g.lineTo(xe - wd, H);
    g.fill();
    g.fillStyle = `hsla(${beamHue},95%,60%,${on ? 0.1 + 0.2 * eN : 0.04})`;
    g.beginPath();
    g.ellipse(xe, H * 0.9, wd * 1.4, H * 0.04, 0, 0, 7);
    g.fill();
  }
  g.globalCompositeOperation = 'source-over';

  /* فلاش راک */
  if (state.style === 'rock' && A.pulse > 0.8 && on) {
    g.fillStyle = `rgba(255,255,255,${0.1 * A.rock * fx.shake})`;
    g.fillRect(0, 0, W, H);
  }

  /* ---------- گربه‌ها ---------- */
  const Sz = Math.min(W / 5.3, H * 0.62);
  const order = [0, 1, 2, 3, 4]; // چپ به راست
  for (const i of order) {
    const cat = CATS[i];
    cat._style = style;
    const x = W * (0.1 + 0.2 * i) + Math.sin(t * 0.35 + i * 2) * W * 0.02 * (1 - A.silence);
    const y = H * 0.94;
    cat.x = x;
    cat.y = y;
    cat.scale = Sz;
    // توجه: cat.draw خودش ترنسفورم را اعمال می‌کند
    cat.draw(g, style, t);
    // "z" خواب
    if (A.silence > 0.6) {
      g.fillStyle = '#fffc';
      g.font = `${Sz * 0.2}px Lalezar`;
      g.fillText('z', x + Sz * 0.2, y - Sz * cat.cfg.bodyH * (1.0 + 0.1 * Math.sin(t * 2 + i)));
    }
  }

  /* ---------- ذرات ---------- */
  parts.draw(g);

  g.restore();

  /* شیک صحنه */
  if (shakeAmount > 0.3) {
    stageEl.style.transform = `translate(${shakeX * 0.4}px, ${shakeY * 0.4}px)`;
  } else {
    stageEl.style.transform = '';
  }

  /* ارتعاش موبایل */
  if (state.style === 'rock' && A.rock > 0.5 && A.pulse > 0.9 && t - lastVib > 0.25 && navigator.vibrate) {
    try { navigator.vibrate(15 + A.rock * 30); } catch (e) {}
    lastVib = t;
  }
}

/* ---------- رسم VU ---------- */
function drawVU(t) {
  vg.setTransform(D, 0, 0, D, 0, 0);
  const vw = vu.width / D, vh = vu.height / D;
  vg.clearRect(0, 0, vw, vh);
  const N = 40;
  for (let i = 0; i < N; i++) {
    const v = A.connected && state.playing
      ? A.freq[Math.floor(Math.pow(i / N, 1.7) * 220) + 1] / 255
      : 0.03;
    const h = Math.max(3, v * vh * (0.85 + 0.15 * Math.sin(t * 5 + i)));
    const hue = (hueCur || 40) + i * 3;
    vg.fillStyle = `hsl(${hue} 80% ${50 + v * 15}%)`;
    const bw = vw / N;
    const x = i * bw + 2;
    const y = vh - h;
    const w = bw - 4;
    if (vg.roundRect) {
      vg.beginPath(); vg.roundRect(x, y, w, h, 3); vg.fill();
    } else {
      vg.fillRect(x, y, w, h);
    }
  }
}

/* ---------- ذرات جدید در ضرب ---------- */
function spawnParticles(t) {
  if (!state.playing || A.silence > 0.5) return;
  if (A.pulse < 0.5) return;
  const style = STYLES[state.style];
  const ptype = style.effects.particles;
  // تعداد ذرات بر اساس انرژی
  const n = 1 + Math.floor(A.sEnergy * 3);
  for (let k = 0; k < n; k++) {
    // موقعیت تصادفی روی صحنه
    const i = Math.floor(Math.random() * CATS.length);
    const cat = CATS[i];
    if (Math.random() < 0.3 + A.sEnergy * 0.5) {
      parts.spawn(ptype, cat.x + rand(-0.2, 0.2) * cat.scale, cat.y - cat.scale * 0.9, hueCur || 40);
    }
  }
}

/* ---------- HUD ---------- */
let hudT = 0;
function hud(t) {
  if (t - hudT < 0.2) return;
  hudT = t;
  const [m, h] = mood();
  let gen = 'منتظر موزیک…';
  if (state.playing) {
    if (A.silence > 0.6) gen = 'سکوت…';
    else if (state.style === 'rock' && A.rock > 0.6) gen = '🤘 راک سنگین — لرزش کامل';
    else if (state.style === 'rock' && A.rock > 0.35) gen = 'گیتار برقی و انرژی';
    else if (A.sEnergy > 0.45) gen = 'پرانرژی و شاد';
    else if (A.sEnergy > 0.2) gen = 'ملایم و روان';
    else gen = 'آرام';
  }
  $('#badge').textContent = gen;
  $('#mm').textContent = m;
  $('#mb').textContent = state.playing && A.hasBpm ? fa(A.bpm) : '—';
  $('#me').textContent = fa(A.sEnergy * 100);
  $('#ue').style.width = (A.sEnergy * 100) + '%';
}

/* ---------- حلقه ---------- */
function tick(now) {
  requestAnimationFrame(tick);
  const dt = Math.min(0.05, (now - lastT) / 1000);
  lastT = now;
  const t = now / 1000;

  /* تحلیل صدا */
  A.update(dt, t, state.playing);

  /* به‌روزرسانی گربه‌ها */
  const style = STYLES[state.style];
  for (const c of CATS) c.update(dt, t, A, style, state.playing);

  /* پخش ذرات */
  spawnParticles(t);
  parts.update(dt);

  /* رکوردها */
  if (state.playing && A.silence < 0.5) {
    const speed = 40 + A.bpm * 0.7 * (0.5 + A.sEnergy);
    reel += dt * speed;
  } else {
    reel += dt * 8;
  }
  $('#r1').style.transform = `rotate(${reel}deg)`;
  $('#r2').style.transform = `rotate(${reel * 0.8}deg)`;

  /* رندر */
  render(dt, t);
  drawVU(t);
  hud(t);
}
requestAnimationFrame(tick);

/* ============================================================
   ۸. پلیر
   ============================================================ */
const list = [];
let cur = -1;
const mmss = s => isFinite(s)
  ? fa(Math.floor(s / 60)) + ':' + fa(Math.floor(s % 60)).padStart(2, '۰')
  : '۰:۰۰';

function addFiles(files) {
  let added = false;
  for (const f of files) {
    if (!f.type.startsWith('audio') &&
        !/\.(mp3|wav|ogg|m4a|flac|aac|opus)$/i.test(f.name)) continue;
    list.push({
      name: f.name.replace(/\.[^.]+$/, ''),
      url: URL.createObjectURL(f),
    });
    added = true;
  }
  if (added) {
    drawList();
    if (cur < 0 && list.length) {
      // بلافاصله اولین آهنگ را لود کن و مودال سبک را باز کن
      load(0, false);
      openStyleModal(true);
    }
  }
}

function drawList() {
  const ul = $('#list');
  ul.innerHTML = '';
  list.forEach((s, i) => {
    const li = document.createElement('li');
    li.className = i === cur ? 'cur' : '';
    li.innerHTML = '<span></span><span>' + fa(i + 1) + '</span>';
    li.firstChild.textContent = s.name;
    li.onclick = () => load(i, true);
    ul.appendChild(li);
  });
}

function load(i, go) {
  if (!list.length) return;
  // آزادسازی URL قبلی برای جلوگیری از نشت حافظه
  if (cur >= 0 && list[cur] && list[cur]._loaded) {
    // (نگه‌داری می‌کنیم چون ممکنه کاربر برگرده)
  }
  cur = (i + list.length) % list.length;
  const item = list[cur];
  au.src = item.url;
  item._loaded = true;
  $('#title').textContent = item.name;
  $('#sub').textContent = 'در حال تحلیل ریتم و حال‌وهوا…';
  A.reset();
  drawList();
  if (go) play();
}

async function play() {
  A.connect();
  await A.resume();
  if (au.src) {
    try { await au.play(); } catch (e) {}
  }
}

function setIcon(isPlaying) {
  $('#ic').innerHTML = isPlaying
    ? '<path d="M6 4h4v16H6zM14 4h4v16h-4z"/>'
    : '<path d="M7 4v16l13-8z"/>';
}

au.onplay  = () => { state.playing = true;  setIcon(true);  };
au.onpause = () => { state.playing = false; setIcon(false); };
au.onended = () => {
  if (list.length > 1) load(cur + 1, true);
  else { state.playing = false; setIcon(false); }
};

/* تایم‌لاین کاغذی */
let seeking = false;
const trackEl = $('#track');
const fillEl  = $('#fill');
const pinEl   = $('#pin');
const tcEl    = $('#tc');
const tdEl    = $('#td');

function updateTimeline() {
  if (!seeking) {
    const p = au.duration ? au.currentTime / au.duration : 0;
    fillEl.style.width = (p * 100) + '%';
    pinEl.style.right  = (p * 100) + '%';
  }
  tcEl.textContent = mmss(au.currentTime);
  tdEl.textContent = mmss(au.duration);
}
au.ontimeupdate = updateTimeline;

function seekAt(clientX) {
  const r = trackEl.getBoundingClientRect();
  // چون RTL هست، از راست به چپ می‌شود
  let p = 1 - (clientX - r.left) / r.width;
  p = clamp(p);
  if (au.duration) au.currentTime = p * au.duration;
  fillEl.style.width = (p * 100) + '%';
  pinEl.style.right = (p * 100) + '%';
}
trackEl.addEventListener('pointerdown', e => {
  seeking = true;
  seekAt(e.clientX);
  trackEl.setPointerCapture(e.pointerId);
});
trackEl.addEventListener('pointermove', e => { if (seeking) seekAt(e.clientX); });
trackEl.addEventListener('pointerup',   e => { seeking = false; try { trackEl.releasePointerCapture(e.pointerId); } catch (_) {} });

/* دکمه‌ها */
$('#play').onclick  = () => au.paused ? play() : au.pause();
$('#prev').onclick  = () => load(cur - 1, true);
$('#next').onclick  = () => load(cur + 1, true);

$('#vol').oninput = e => {
  au.volume = e.target.value / 100;
};
au.volume = .85;
$('#vol').value = 85;

/* انتخاب فایل و drag&drop */
$('#file').onchange = e => addFiles(e.target.files);
for (const el of [$('#drop'), stageEl]) {
  el.addEventListener('dragover', e => {
    e.preventDefault();
    $('#drop').classList.add('on');
  });
  el.addEventListener('dragleave', () => $('#drop').classList.remove('on'));
  el.addEventListener('drop', e => {
    e.preventDefault();
    $('#drop').classList.remove('on');
    if (e.dataTransfer && e.dataTransfer.files) addFiles(e.dataTransfer.files);
  });
}

/* ============================================================
   ۹. مودال انتخاب سبک
   ============================================================ */
function buildStyleGrid() {
  const grid = $('#styleGrid');
  grid.innerHTML = '';
  for (const [key, s] of Object.entries(STYLES)) {
    const card = document.createElement('div');
    card.className = 'style-card';
    card.innerHTML = `
      <div class="swatch" style="background:${s.swatch}"></div>
      ${s.icon}
      <b>${s.name}</b>
      <span>${s.tagline}</span>
    `;
    card.onclick = () => {
      state.style = key;
      $('#styleName').textContent = 'سبک: ' + s.name;
      // به‌روزرسانی آنی رنگ صحنه
      hueCur = null;
      closeStyleModal();
    };
    grid.appendChild(card);
  }
}
function openStyleModal(force) {
  state.showModal = true;
  $('#modal').classList.add('on');
}
function closeStyleModal() {
  state.showModal = false;
  $('#modal').classList.remove('on');
  // اگر آهنگ لود شده ولی پخشی نشده، شروع کن
  if (au.src && au.paused && list.length) play();
}
$('#modal').addEventListener('click', e => {
  if (e.target.id === 'modal') closeStyleModal();
});
$('#styleBtn').onclick = () => openStyleModal();
